<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChatCom</title>
    <meta name="theme-color" content="#121212">
    <meta name="description" content="ChatCom - Simple & Fast">

    <!-- PWA Manifest Injection -->
    <link rel="manifest" id="manifest-placeholder">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-2: #2d2d2d;
            --text: #e0e0e0;
            --text-muted: #a0a0a0;
            --danger: #ef4444;
            --success: #10b981;
            --bubble-me: #8b5cf6;
            --bubble-them: #2d2d2d;
            --font: 'Inter', sans-serif;
            --radius: 24px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; }

        /* --- Animations --- */
        @keyframes slideInUp { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes highlightFlash {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.5); transform: scale(1.02); }
            100% { filter: brightness(1); transform: scale(1); }
        }

        /* --- Layout --- */
        #app { display: flex; flex-direction: column; height: 100%; position: relative; max-width: 1200px; margin: 0 auto; background: var(--bg); }
        
        /* Auth Screen */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px;
        }
        .auth-card {
            background: var(--surface); padding: 30px; border-radius: var(--radius);
            width: 100%; max-width: 400px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .auth-input {
            width: 100%; padding: 15px; margin: 10px 0;
            background: var(--surface-2); border: 1px solid #444; color: white;
            border-radius: var(--radius); font-size: 1rem; outline: none; transition: 0.3s;
        }
        .auth-input:focus { border-color: var(--primary); }
        .btn {
            width: 100%; padding: 15px; margin-top: 10px;
            background: var(--primary); color: white; border: none;
            border-radius: var(--radius); font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .btn-text { background: transparent; color: var(--text-muted); margin-top: 15px; }

        /* Header */
        header {
            display: flex; align-items: center; padding: 10px 15px;
            background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05); height: 65px; z-index: 50;
        }
        .chat-info { display: flex; align-items: center; flex: 1; cursor: pointer; }
        .chat-img { width: 42px; height: 42px; border-radius: 50%; background: #444; object-fit: cover; margin-right: 12px; }
        .chat-meta { display: flex; flex-direction: column; }
        .chat-name { font-weight: 600; font-size: 1rem; }
        .chat-status { font-size: 0.75rem; color: var(--success); }
        .header-actions { display: flex; gap: 15px; color: var(--primary); font-size: 1.2rem; cursor: pointer; }

        /* Content */
        #main-content { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Chat Area */
        #chat-area {
            flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 30px;
            display: flex; flex-direction: column; gap: 10px;
            background-size: cover; background-position: center;
            scroll-behavior: smooth;
        }
        #chat-area::-webkit-scrollbar { width: 6px; }
        #chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        
        /* Messages */
        .msg-group { display: flex; flex-direction: column; width: 100%; position: relative; }
        
        .msg {
            max-width: 75%; padding: 12px 18px; border-radius: 24px;
            position: relative; word-wrap: break-word; font-size: 0.95rem;
            animation: slideInUp 0.3s ease-out forwards; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background 0.3s;
            z-index: 1;
        }
        .msg.me { align-self: flex-end; background: var(--bubble-me); color: white; border-bottom-right-radius: 4px; }
        .msg.them { align-self: flex-start; background: var(--bubble-them); color: var(--text); border-bottom-left-radius: 4px; }
        
        .msg.highlight-anim { animation: highlightFlash 1s ease; }

        /* --- ACTION MENU --- */
        .msg-actions {
            position: absolute; top: -38px;
            background: var(--surface); border: 1px solid var(--surface-2);
            border-radius: 50px; padding: 6px 12px; display: flex; gap: 12px;
            
            opacity: 0; 
            pointer-events: none; 
            transform: translateY(10px) scale(0.9);
            transition: opacity 0.2s, transform 0.2s;
            transition-delay: 0.5s; 
            
            box-shadow: 0 5px 20px rgba(0,0,0,0.5); z-index: 100;
        }
        .msg-actions::after {
            content: ''; position: absolute; left: 0; bottom: -20px; width: 100%; height: 20px;
        }

        .msg:hover .msg-actions, .msg-actions:hover { 
            opacity: 1; 
            pointer-events: auto; 
            transform: translateY(0) scale(1);
            transition-delay: 0s; 
        }
        
        .me .msg-actions { right: 0; }
        .them .msg-actions { left: 0; }
        
        .action-btn { color: var(--text-muted); cursor: pointer; font-size: 1.1rem; transition: color 0.2s, transform 0.2s; }
        .action-btn:hover { color: var(--primary); transform: scale(1.2); }
        .action-btn.delete:hover { color: var(--danger); }

        .msg-sender { font-size: 0.7rem; color: rgba(255,255,255,0.7); margin-bottom: 4px; display: block; font-weight: 500; }
        .them .msg-sender { color: var(--primary); }
        
        .msg-img { max-width: 100%; border-radius: 16px; margin-top: 5px; cursor: pointer; display: block; }
        .msg-meta { display: flex; justify-content: flex-end; align-items: center; gap: 5px; margin-top: 4px; font-size: 0.65rem; opacity: 0.7; }
        
        /* Reply Context */
        .reply-context {
            border-left: 3px solid var(--primary); background: rgba(0,0,0,0.2);
            padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 0.8rem;
            cursor: pointer; opacity: 0.9; transition: background 0.2s;
        }
        .reply-context:hover { background: rgba(0,0,0,0.3); }

        /* Input */
        #input-area {
            background: var(--surface); padding: 10px 15px; display: flex; align-items: flex-end; gap: 10px;
            border-top: 1px solid var(--surface-2); padding-bottom: max(10px, env(safe-area-inset-bottom));
        }
        .attach-btn { color: var(--primary); font-size: 1.5rem; padding: 10px; cursor: pointer; }
        .input-wrapper {
            flex: 1; background: var(--surface-2); border-radius: 24px;
            display: flex; flex-direction: column; padding: 10px 18px;
        }
        #reply-indicator {
            display: none; justify-content: space-between; align-items: center;
            padding-bottom: 8px; border-bottom: 1px solid #444; margin-bottom: 5px; font-size: 0.8rem; color: var(--text-muted);
        }
        textarea {
            width: 100%; background: transparent; border: none; color: white;
            resize: none; font-family: var(--font); font-size: 1rem; max-height: 120px; outline: none; padding: 0;
        }
        .send-btn {
            background: var(--primary); color: white; width: 44px; height: 44px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            border: none; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
        }
        .send-btn:hover { background: var(--primary-dark); transform: scale(1.1); }
        .typing-indicator { font-size: 0.75rem; color: var(--primary); padding: 5px 20px; position: absolute; bottom: 80px; left: 0; width: 100%; pointer-events: none; opacity: 0; transition: opacity 0.3s; font-weight: 500; }

        /* Nav */
        nav {
            background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px); 
            border-top: 1px solid var(--surface-2); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }
        .nav-item { color: var(--text-muted); text-align: center; font-size: 0.7rem; cursor: pointer; transition: 0.3s; flex: 1; }
        .nav-item i { display: block; font-size: 1.3rem; margin-bottom: 4px; transition: transform 0.2s; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-3px); }

        /* Sections */
        .section-view { display: none; height: 100%; overflow-y: auto; padding: 20px; }
        .section-view.active { display: block; }

        /* Media */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
        .gallery-item { aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #333; position: relative; cursor: pointer; transition: transform 0.2s; }
        .gallery-item:hover { transform: scale(1.03); z-index: 2; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

        /* Members */
        .member-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid var(--surface-2); border-radius: 12px; }
        .member-pic { width: 44px; height: 44px; border-radius: 50%; margin-right: 15px; object-fit: cover; border: 2px solid var(--surface-2); }
        .member-info h4 { margin: 0; font-size: 1rem; }
        .member-info span { font-size: 0.8rem; color: var(--text-muted); }

        /* Profile */
        .profile-container { text-align: center; max-width: 500px; margin: 0 auto; animation: slideInUp 0.4s ease; }
        .profile-pic-lg { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--primary); margin-bottom: 20px; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* Modals */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2000; display: none;
            justify-content: center; align-items: center; padding: 20px;
            backdrop-filter: blur(5px); opacity: 0; transition: opacity 0.2s ease;
        }
        .modal.open { display: flex; opacity: 1; }
        .modal-content { 
            background: var(--surface); padding: 30px; border-radius: 24px; width: 100%; max-width: 400px; 
            position: relative; max-height: 80vh; overflow-y: auto;
            transform: scale(0.9); transition: transform 0.2s;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05);
        }
        .modal.open .modal-content { transform: scale(1); }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
        .close-modal:hover { color: white; }

        .by-gabo { position: fixed; bottom: 5px; right: 5px; font-size: 0.6rem; color: rgba(255,255,255,0.1); pointer-events: none; z-index: 9999; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Auth -->
    <div id="auth-screen">
        <div class="auth-card">
            <h1 style="color: var(--primary); margin-bottom: 5px;">ChatCom</h1>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Smooth. Fast. Yours.</p>
            <form id="auth-form">
                <input type="text" id="auth-user" class="auth-input" placeholder="Username" required autocomplete="username">
                <input type="password" id="auth-pass" class="auth-input" placeholder="Password" required autocomplete="current-password">
                <button type="submit" class="btn" id="login-btn">Log In</button>
                <button type="button" class="btn btn-text" id="toggle-auth">First time? Create Account</button>
            </form>
            <p id="auth-msg" style="color: var(--danger); font-size: 0.9rem; margin-top:10px; min-height: 20px;"></p>
        </div>
    </div>

    <!-- App -->
    <div id="app" class="hidden">
        <header>
            <div class="chat-info" onclick="openChatSettings()">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" id="header-img" class="chat-img" alt="Chat">
                <div class="chat-meta">
                    <div class="chat-name" id="header-title">New chat</div>
                    <div class="chat-status" id="member-count">Loading...</div>
                </div>
            </div>
            <div class="header-actions"><i class="fas fa-pen" onclick="openChatSettings()"></i></div>
        </header>

        <div id="main-content">
            <div id="view-messages" class="section-view active" style="padding:0; display:flex; flex-direction:column;">
                <div id="chat-area">
                    <div style="text-align:center; padding: 40px 20px; color: var(--text-muted); opacity: 0.6;">
                        <i class="fas fa-bolt" style="font-size: 2rem; margin-bottom: 10px; display:block;"></i>
                        Welcome to ChatCom.
                    </div>
                </div>
                <div class="typing-indicator" id="typing-indicator"></div>
                
                <div id="input-area">
                    <label class="attach-btn"><i class="fas fa-image"></i><input type="file" id="file-input" style="display: none;" accept="image/*"></label>
                    <div class="input-wrapper">
                        <div id="reply-indicator">
                            <span id="reply-text">Replying...</span>
                            <i class="fas fa-times" onclick="cancelReply()"></i>
                        </div>
                        <textarea id="msg-input" rows="1" placeholder="Type a message..."></textarea>
                    </div>
                    <button class="send-btn" id="send-btn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div id="view-media" class="section-view"><h2 style="margin-top:0;">Media Gallery</h2><div class="gallery-grid" id="media-gallery"></div></div>
            <div id="view-members" class="section-view"><h2 style="margin-top:0;">Members <span id="members-total" style="font-size:0.6em; color:var(--text-muted);">(0)</span></h2><div id="members-list"></div></div>
            <div id="view-profile" class="section-view">
                <div class="profile-container">
                    <img id="profile-pic-preview" class="profile-pic-lg" src="" alt="Profile"><br>
                    <button class="btn" style="width:auto; padding: 8px 20px;" onclick="document.getElementById('profile-upload').click()">Change Photo</button>
                    <input type="file" id="profile-upload" style="display: none;" accept="image/*">
                    <div style="margin-top: 30px; text-align: left;">
                        <label style="font-size: 0.9rem; color: var(--text-muted);">Display Name</label>
                        <input type="text" id="profile-name" class="auth-input">
                        <button class="btn" onclick="updateProfile()">Save Changes</button>
                    </div>
                    <div style="margin-top: 50px; border-top: 1px solid var(--surface-2); padding-top: 25px;">
                        <button class="btn" onclick="logout()" style="background: var(--surface-2);">Log Out</button>
                        <button class="btn" onclick="deleteAccount()" style="background: rgba(239, 68, 68, 0.2); color: var(--danger); margin-top: 15px;">Delete Account</button>
                    </div>
                </div>
            </div>
        </div>

        <nav>
            <div class="nav-item active" onclick="switchTab('messages')"><i class="fas fa-comment-alt"></i> Messages</div>
            <div class="nav-item" onclick="switchTab('media')"><i class="fas fa-images"></i> Media</div>
            <div class="nav-item" onclick="switchTab('members')"><i class="fas fa-users"></i> Members</div>
            <div class="nav-item" onclick="switchTab('profile')"><i class="fas fa-user"></i> Profile</div>
        </nav>
    </div>

    <!-- Chat Settings Modal -->
    <div id="chat-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('chat-modal')">&times;</span>
            <h3 style="margin-top: 0; text-align: center;">Chat Settings</h3>
            <div style="text-align: center; margin-bottom: 20px;">
                <img id="chat-edit-img" src="" style="width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary);">
                <br>
                <button class="btn btn-text" style="margin-top: 10px;" onclick="document.getElementById('chat-img-upload').click()">Change Icon</button>
                <input type="file" id="chat-img-upload" hidden accept="image/*">
            </div>
            <label style="font-size: 0.8rem; color: var(--text-muted);">Chat Name</label>
            <input type="text" id="chat-edit-name" class="auth-input" placeholder="Chat Name">
            <div style="margin: 15px 0;">
                <label style="font-size: 0.8rem; color: var(--text-muted);">Chat Background</label>
                <label class="btn" style="background: var(--surface-2); color: var(--text); display: block; text-align: center; margin-top: 5px; cursor: pointer;">
                    <i class="fas fa-upload"></i> Upload Image
                    <input type="file" id="chat-bg-upload" style="display: none;" accept="image/*">
                </label>
            </div>
            <button class="btn" id="save-chat-btn" onclick="saveChatSettings()">Save Changes</button>
        </div>
    </div>

    <!-- Media Viewer -->
    <div id="media-modal" class="modal" onclick="closeModal('media-modal')">
        <div class="modal-content" style="background: transparent; max-width: 90%; text-align: center; box-shadow: none; border: none;">
            <div id="media-modal-content"></div>
        </div>
    </div>

    <div class="by-gabo">By GaboGabo</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, setDoc, getDocs, where, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTUuJTNqrSZKS66B9kOzXVR2SftkRyeVw",
            authDomain: "chatcom-2528d.firebaseapp.com",
            projectId: "chatcom-2528d",
            messagingSenderId: "297806856410",
            appId: "1:297806856410:web:f44eb27004f0735d2da5e3",
            measurementId: "G-W6DC5RM8G5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = null;
        let isRegistering = false;
        let replyTo = null;
        const DEFAULT_PIC = "https://ui-avatars.com/api/?background=random&color=fff&name=";

        function compressAndConvertImage(file) {
            return new Promise((resolve, reject) => {
                if (!file.type.startsWith('image/')) { reject('Only images supported.'); return; }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600; 
                        let width = img.width; let height = img.height;
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.onerror = (e) => reject(e);
                };
            });
        }

        async function hashPassword(str) {
            const msgBuffer = new TextEncoder().encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function checkAuth() {
            const savedUser = localStorage.getItem('chatcom_user');
            if (savedUser) { currentUser = JSON.parse(savedUser); initApp(); }
            else { document.getElementById('auth-screen').style.display = 'flex'; }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const user = document.getElementById('auth-user').value.trim().toLowerCase();
            const pass = document.getElementById('auth-pass').value;
            const msgEl = document.getElementById('auth-msg');
            const btn = document.getElementById('login-btn');
            
            if (!user || !pass) return;
            btn.textContent = "Processing..."; btn.disabled = true;

            try {
                const passHash = await hashPassword(pass);
                const usersRef = collection(db, "users");
                const q = query(usersRef, where("username", "==", user));
                const querySnapshot = await getDocs(q);

                if (isRegistering) {
                    if (!querySnapshot.empty) { msgEl.textContent = "Username taken."; btn.disabled=false; return; }
                    const newUser = { username: user, password: passHash, displayName: user, photoURL: DEFAULT_PIC + user, joinedAt: serverTimestamp(), status: 'online' };
                    const docRef = await addDoc(usersRef, newUser);
                    currentUser = { ...newUser, id: docRef.id };
                    localStorage.setItem('chatcom_user', JSON.stringify(currentUser));
                    initApp();
                } else {
                    if (querySnapshot.empty) { msgEl.textContent = "User not found."; btn.disabled=false; return; }
                    const userData = querySnapshot.docs[0].data();
                    if (userData.password === passHash) {
                        currentUser = { ...userData, id: querySnapshot.docs[0].id };
                        localStorage.setItem('chatcom_user', JSON.stringify(currentUser));
                        updateDoc(doc(db, "users", currentUser.id), { status: 'online' });
                        initApp();
                    } else { msgEl.textContent = "Wrong password."; btn.disabled=false; }
                }
            } catch (err) { console.error(err); btn.disabled=false; }
        }

        document.getElementById('auth-form').addEventListener('submit', handleAuth);
        document.getElementById('toggle-auth').addEventListener('click', () => {
            isRegistering = !isRegistering;
            document.getElementById('login-btn').textContent = isRegistering ? "Register" : "Log In";
            document.getElementById('toggle-auth').textContent = isRegistering ? "Have account? Log In" : "First time? Create Account";
            document.getElementById('auth-msg').textContent = "";
        });

        window.logout = function() { localStorage.removeItem('chatcom_user'); location.reload(); }
        window.deleteAccount = async function() { if(confirm("Are you sure?")) { await deleteDoc(doc(db, "users", currentUser.id)); logout(); } }

        function initApp() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
            listenToMessages(); listenToMembers(); listenToChatSettings(); listenToTyping();
            document.getElementById('profile-name').value = currentUser.displayName;
            document.getElementById('profile-pic-preview').src = currentUser.photoURL;
        }

        const chatArea = document.getElementById('chat-area');
        
        function listenToMessages() {
            const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
            onSnapshot(q, (snapshot) => {
                const wasAtBottom = chatArea.scrollHeight - chatArea.scrollTop - chatArea.clientHeight < 250;
                chatArea.innerHTML = '<div style="height:10px"></div>'; 
                snapshot.forEach((docSnap) => renderMessage(docSnap.id, docSnap.data()));
                if (wasAtBottom) scrollToBottom();
                updateGallery(snapshot.docs);
            });
        }

        function renderMessage(id, msg) {
            const isMe = msg.senderId === currentUser.id;
            const div = document.createElement('div');
            div.className = `msg-group ${isMe ? 'me' : 'them'}`;
            div.id = `msg-${id}`;
            
            let contentHtml = '';
            if(msg.replyTo) {
                contentHtml += `
                    <div class="reply-context" onclick="scrollToMessage('${msg.replyTo.id}')">
                        <small><b>${msg.replyTo.sender}</b></small><br>
                        ${msg.replyTo.text.substring(0,30)}...
                    </div>`;
            }
            if (msg.type === 'image' && msg.mediaData) contentHtml += `<img src="${msg.mediaData}" class="msg-img" onclick="viewMedia('${id}', 'img')">`;
            if (msg.text) contentHtml += `<span>${msg.text}</span>`;

            // Hover Menu (Only Reply and Delete)
            const actionsHtml = `
                <div class="msg-actions">
                    <i class="fas fa-reply action-btn" onclick="startReply('${id}', '${msg.senderName}', '${msg.text || 'Image'}')" title="Reply"></i>
                    ${isMe ? `<i class="fas fa-trash action-btn delete" onclick="deleteMessage('${id}')" title="Delete"></i>` : ''}
                </div>
            `;

            const time = msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';

            div.innerHTML = `
                <div class="msg ${isMe ? 'me' : 'them'}">
                    ${actionsHtml}
                    ${!isMe ? `<span class="msg-sender">${msg.senderName}</span>` : ''}
                    ${contentHtml}
                    <div class="msg-meta">${time} ${isMe ? '<i class="fas fa-check-double"></i>' : ''}</div>
                </div>
            `;
            
            if(msg.mediaData) div.dataset.media = msg.mediaData;
            chatArea.appendChild(div);
        }

        window.scrollToMessage = function(id) {
            const el = document.getElementById(`msg-${id}`);
            if(el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                const bubble = el.querySelector('.msg');
                bubble.classList.add('highlight-anim');
                setTimeout(() => bubble.classList.remove('highlight-anim'), 1000);
            }
        }

        function scrollToBottom() { setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 100); }

        const msgInput = document.getElementById('msg-input');
        const fileInput = document.getElementById('file-input');

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
            updateTypingStatus();
        });

        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;
            msgInput.value = '';
            const msgData = { text: text, senderId: currentUser.id, senderName: currentUser.displayName, timestamp: serverTimestamp(), type: 'text', replyTo: replyTo };
            await addDoc(collection(db, "messages"), msgData);
            cancelReply(); scrollToBottom();
        }

        window.deleteMessage = async function(msgId) {
            if(confirm("Delete this message?")) await deleteDoc(doc(db, "messages", msgId));
        }

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const btn = document.querySelector('.attach-btn');
            const originalIcon = btn.innerHTML; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            try {
                const base64String = await compressAndConvertImage(file);
                await addDoc(collection(db, "messages"), { text: '', mediaData: base64String, senderId: currentUser.id, senderName: currentUser.displayName, timestamp: serverTimestamp(), type: 'image' });
                scrollToBottom();
            } catch (err) { alert("Image error."); }
            btn.innerHTML = originalIcon; fileInput.value = ''; 
        });

        let typingTimeout;
        function updateTypingStatus() {
            updateDoc(doc(db, "users", currentUser.id), { isTyping: true });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { updateDoc(doc(db, "users", currentUser.id), { isTyping: false }); }, 2000);
        }

        function listenToTyping() {
            onSnapshot(query(collection(db, "users"), where("isTyping", "==", true)), (snap) => {
                const names = snap.docs.map(d => d.data()).filter(u => u.username !== currentUser.username).map(u => u.displayName);
                const el = document.getElementById('typing-indicator');
                el.style.opacity = names.length > 0 ? 1 : 0;
                if (names.length > 0) el.textContent = `${names.join(', ')} is typing...`;
            });
        }

        window.startReply = function(id, sender, text) {
            replyTo = { id, sender, text };
            document.getElementById('reply-indicator').style.display = 'flex';
            document.getElementById('reply-text').innerHTML = `Replying to <b>${sender}</b>`;
            msgInput.focus();
        }
        window.cancelReply = function() { replyTo = null; document.getElementById('reply-indicator').style.display = 'none'; }

        window.switchTab = function(tabId) {
            document.querySelectorAll('.section-view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${tabId}`).classList.add('active');
            const index = ['messages','media','members','profile'].indexOf(tabId);
            document.querySelectorAll('.nav-item')[index].classList.add('active');
        }

        function listenToMembers() {
            onSnapshot(collection(db, "users"), (snap) => {
                const list = document.getElementById('members-list'); list.innerHTML = '';
                document.getElementById('members-total').textContent = `(${snap.size})`;
                document.getElementById('member-count').textContent = `${snap.size} members`;
                snap.forEach(doc => {
                    const u = doc.data();
                    list.innerHTML += `<div class="member-item"><img src="${u.photoURL}" class="member-pic"><div class="member-info"><h4>${u.displayName}</h4><span>${u.status||'Offline'}</span></div></div>`;
                });
            });
        }

        function updateGallery(docs) {
            const grid = document.getElementById('media-gallery'); grid.innerHTML = '';
            docs.forEach(d => {
                const m = d.data();
                if (m.type === 'image' && m.mediaData) {
                    grid.innerHTML += `<div class="gallery-item" onclick="viewMedia('${d.id}', 'img', '${m.mediaData}')"><img src="${m.mediaData}" loading="lazy"></div>`;
                }
            });
        }

        window.viewMedia = function(id, type, directUrl) {
            const modal = document.getElementById('media-modal');
            const content = document.getElementById('media-modal-content');
            let src = directUrl;
            if(!src) { const el = document.getElementById(`msg-${id}`); if(el) src = el.dataset.media; }
            if(src) { content.innerHTML = `<img src="${src}" style="max-width:100%; max-height:80vh; border-radius:12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);">`; openModal('media-modal'); }
        }

        const settingsDocId = "global_settings";
        function listenToChatSettings() {
            onSnapshot(doc(db, "chat_settings", settingsDocId), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('header-title').textContent = data.name || "New chat";
                    document.getElementById('header-img').src = data.photo || DEFAULT_PIC + "Chat";
                    if (data.background) document.getElementById('chat-area').style.backgroundImage = `url(${data.background})`;
                    document.getElementById('chat-edit-name').value = data.name || "";
                    document.getElementById('chat-edit-img').src = data.photo || "";
                }
            });
        }

        window.openChatSettings = function() { openModal('chat-modal'); }
        window.saveChatSettings = async function() {
            const btn = document.getElementById('save-chat-btn'); btn.textContent = "Saving..."; btn.disabled = true;
            try {
                const name = document.getElementById('chat-edit-name').value;
                const imgFile = document.getElementById('chat-img-upload').files[0];
                const bgFile = document.getElementById('chat-bg-upload').files[0];
                let data = { name: name };
                if (imgFile) data.photo = await compressAndConvertImage(imgFile);
                if (bgFile) data.background = await compressAndConvertImage(bgFile);
                await setDoc(doc(db, "chat_settings", settingsDocId), data, { merge: true });
                btn.textContent = "Saved!"; setTimeout(() => { closeModal('chat-modal'); btn.textContent = "Save Changes"; btn.disabled = false; }, 500);
            } catch (error) { console.error(error); btn.disabled = false; }
        }

        window.updateProfile = async function() {
            const btn = event.target; const originalText = btn.textContent; btn.textContent = "Saving...";
            const name = document.getElementById('profile-name').value;
            const file = document.getElementById('profile-upload').files[0];
            let updateData = { displayName: name };
            if (file) updateData.photoURL = await compressAndConvertImage(file);
            await updateDoc(doc(db, "users", currentUser.id), updateData);
            currentUser = { ...currentUser, ...updateData };
            localStorage.setItem('chatcom_user', JSON.stringify(currentUser));
            document.getElementById('profile-pic-preview').src = currentUser.photoURL;
            btn.textContent = "Saved!"; setTimeout(() => btn.textContent = originalText, 1000);
        }

        window.openModal = function(id) { const el = document.getElementById(id); el.style.display = 'flex'; setTimeout(() => el.classList.add('open'), 10); }
        window.closeModal = function(id) { const el = document.getElementById(id); el.classList.remove('open'); setTimeout(() => el.style.display = 'none', 200); }

        const manifest = { "name": "ChatCom", "short_name": "ChatCom", "start_url": ".", "display": "standalone", "background_color": "#121212", "theme_color": "#121212", "icons": [{ "src": "https://ui-avatars.com/api/?name=CC&background=8b5cf6&color=fff&size=192", "sizes": "192x192", "type": "image/png" }] };
        document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/json'})));

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(URL.createObjectURL(new Blob([`
                self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', e => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });
            `], {type: 'application/javascript'})));
        }

        checkAuth();
    </script>
</body>
</html>
