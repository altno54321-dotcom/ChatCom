<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChatCom</title>
    <meta name="theme-color" content="#121212">
    <meta name="description" content="ChatCom - Groups & Roles">

    <!-- PWA Manifest Injection -->
    <link rel="manifest" id="manifest-placeholder">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-2: #2d2d2d;
            --text: #e0e0e0;
            --text-muted: #a0a0a0;
            --danger: #ef4444;
            --success: #10b981;
            --bubble-me: #3b82f6;
            --bubble-them: #2d2d2d;
            --font: 'Inter', sans-serif;
            --radius: 24px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; }

        /* --- Animations --- */
        @keyframes slideInUp { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes highlightFlash { 0% { filter: brightness(1); } 50% { filter: brightness(1.5); } 100% { filter: brightness(1); } }

        /* --- Layout --- */
        #app { display: flex; flex-direction: column; height: 100%; position: relative; max-width: 1200px; margin: 0 auto; background: var(--bg); }
        
        /* Auth Screen */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .auth-card { background: var(--surface); padding: 30px; border-radius: var(--radius); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .auth-input { width: 100%; padding: 15px; margin: 10px 0; background: var(--surface-2); border: 1px solid #444; color: white; border-radius: var(--radius); font-size: 1rem; outline: none; transition: 0.3s; }
        .auth-input:focus { border-color: var(--primary); }
        .btn { width: 100%; padding: 15px; margin-top: 10px; background: var(--primary); color: white; border: none; border-radius: var(--radius); font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .btn-text { background: transparent; color: var(--text-muted); margin-top: 15px; }

        /* Header */
        header { display: flex; align-items: center; padding: 10px 15px; background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.05); height: 65px; z-index: 50; }
        .chat-info { display: flex; align-items: center; flex: 1; cursor: pointer; }
        .chat-img { width: 42px; height: 42px; border-radius: 50%; background: #444; object-fit: cover; margin-right: 12px; }
        .chat-meta { display: flex; flex-direction: column; }
        .chat-name { font-weight: 600; font-size: 1rem; }
        .chat-status { font-size: 0.75rem; color: var(--success); }
        .header-actions { display: flex; gap: 15px; color: var(--primary); font-size: 1.2rem; cursor: pointer; }

        /* Content */
        #main-content { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .section-view { display: none; height: 100%; overflow-y: auto; padding: 0; }
        .section-view.active { display: flex; flex-direction: column; }

        /* Chat Area */
        #chat-area { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 30px; display: flex; flex-direction: column; gap: 10px; background-size: cover; background-position: center; scroll-behavior: smooth; }
        
        /* Messages */
        .msg-row { display: flex; align-items: flex-end; margin-bottom: 8px; width: 100%; }
        .msg-row.me { justify-content: flex-end; }
        .msg-row.them { justify-content: flex-start; }
        .msg-pfp { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; margin-right: 8px; margin-bottom: 5px; border: 1px solid var(--surface-2); flex-shrink: 0; }
        
        .msg { max-width: 75%; padding: 12px 18px; border-radius: 24px; position: relative; word-wrap: break-word; font-size: 0.95rem; animation: slideInUp 0.3s ease-out forwards; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: background 0.3s; z-index: 1; }
        .msg.me { background: var(--bubble-me); color: white; border-bottom-right-radius: 4px; }
        .msg.them { background: var(--bubble-them); color: var(--text); border-bottom-left-radius: 4px; }
        
        .msg-img { max-width: 100%; border-radius: 16px; margin-top: 5px; cursor: pointer; }
        .msg-meta { display: flex; justify-content: flex-end; align-items: center; gap: 5px; margin-top: 4px; font-size: 0.65rem; opacity: 0.7; }
        
        /* Hover Actions */
        .msg-actions { position: absolute; top: -38px; background: var(--surface); border: 1px solid var(--surface-2); border-radius: 50px; padding: 6px 12px; display: flex; gap: 12px; opacity: 0; pointer-events: none; transform: translateY(10px) scale(0.9); transition: opacity 0.2s, transform 0.2s; transition-delay: 0.5s; box-shadow: 0 5px 20px rgba(0,0,0,0.5); z-index: 100; }
        .msg-actions::after { content: ''; position: absolute; left: 0; bottom: -20px; width: 100%; height: 20px; }
        .msg:hover .msg-actions, .msg-actions:hover { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); transition-delay: 0s; }
        .me .msg-actions { right: 0; }
        .them .msg-actions { left: 0; }
        .action-btn { color: var(--text-muted); cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .action-btn:hover { color: var(--primary); transform: scale(1.2); }
        .action-btn.delete:hover { color: var(--danger); }

        .msg-sender { font-size: 0.7rem; color: rgba(255,255,255,0.7); margin-bottom: 4px; display: block; font-weight: 500; }
        .them .msg-sender { color: var(--primary); }

        /* Input */
        #input-area { background: var(--surface); padding: 10px 15px; display: flex; align-items: flex-end; gap: 10px; border-top: 1px solid var(--surface-2); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        .attach-btn { color: var(--primary); font-size: 1.5rem; padding: 10px; cursor: pointer; }
        .input-wrapper { flex: 1; background: var(--surface-2); border-radius: 24px; display: flex; flex-direction: column; padding: 10px 18px; }
        #reply-indicator { display: none; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid #444; margin-bottom: 5px; font-size: 0.8rem; color: var(--text-muted); }
        textarea { width: 100%; background: transparent; border: none; color: white; resize: none; font-family: var(--font); font-size: 1rem; max-height: 120px; outline: none; padding: 0; }
        .send-btn { background: var(--primary); color: white; width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: none; cursor: pointer; transition: 0.2s; }
        
        /* Typing Indicator */
        .typing-indicator { font-size: 0.75rem; color: var(--primary); padding: 5px 20px; position: absolute; bottom: 80px; left: 0; width: 100%; pointer-events: none; opacity: 0; transition: 0.3s; z-index: 5; }

        /* Nav */
        nav { background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--surface-2); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
        .nav-item { color: var(--text-muted); text-align: center; font-size: 0.7rem; cursor: pointer; transition: 0.3s; flex: 1; }
        .nav-item i { display: block; font-size: 1.3rem; margin-bottom: 4px; transition: 0.2s; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-3px); }

        /* Groups List */
        .group-item { display: flex; align-items: center; padding: 15px; background: var(--surface); border-radius: 16px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .group-item:hover { background: var(--surface-2); }
        .group-item.active { border-color: var(--primary); background: rgba(59, 130, 246, 0.1); }
        .group-pic { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-right: 15px; }
        .group-info h4 { margin: 0; font-size: 1rem; }
        .group-info span { font-size: 0.8rem; color: var(--text-muted); }

        /* Members List (Restored) */
        .member-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid var(--surface-2); border-radius: 12px; margin-bottom: 5px; }
        .member-pic { width: 44px; height: 44px; border-radius: 50%; margin-right: 15px; object-fit: cover; border: 2px solid var(--surface-2); }
        .member-info h4 { margin: 0; font-size: 1rem; }
        .member-info span { font-size: 0.8rem; color: var(--text-muted); }
        .role-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
        .role-owner { color: #fbbf24; border: 1px solid #fbbf24; } 
        .role-manager { color: #60a5fa; border: 1px solid #60a5fa; }
        .member-action { margin-left: auto; color: var(--text-muted); cursor: pointer; padding: 5px; }

        /* Profile (Restored) */
        .profile-container { text-align: center; max-width: 500px; margin: 20px auto; padding: 20px; }
        .profile-pic-lg { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--primary); margin-bottom: 20px; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: var(--surface); padding: 30px; border-radius: 24px; width: 100%; max-width: 400px; position: relative; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }

        /* Media */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; cursor: pointer; }

        /* Fixed Reply UI */
        .reply-context {
            display: block; 
            border-left: 3px solid var(--primary); 
            background: rgba(0,0,0,0.3); 
            padding: 8px 12px; 
            border-radius: 8px; 
            margin-bottom: 8px; 
            font-size: 0.85rem;
            cursor: pointer; 
            opacity: 0.9; 
            transition: background 0.2s;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .reply-context:hover { background: rgba(0,0,0,0.5); }
        .reply-context small { display: block; margin-bottom: 2px; color: var(--primary); }

        .by-gabo { position: fixed; bottom: 5px; right: 5px; font-size: 0.6rem; color: rgba(255,255,255,0.1); pointer-events: none; z-index: 9999; }
        .hidden { display: none !important; }
        .msg.highlight-anim { animation: highlightFlash 1s ease; }
    </style>
</head>
<body>

    <!-- Auth -->
    <div id="auth-screen">
        <div class="auth-card">
            <h1 style="color: var(--primary);">ChatCom</h1>
            <p>Connect. Group. Chat.</p>
            <form id="auth-form">
                <input type="text" id="auth-user" class="auth-input" placeholder="Username" required autocomplete="username">
                <input type="password" id="auth-pass" class="auth-input" placeholder="Password" required autocomplete="current-password">
                <button type="submit" class="btn" id="login-btn">Log In</button>
                <button type="button" class="btn btn-text" id="toggle-auth">First time? Create Account</button>
            </form>
            <p id="auth-msg" style="color: var(--danger); font-size: 0.9rem; margin-top:10px;"></p>
        </div>
    </div>

    <!-- App -->
    <div id="app" class="hidden">
        <header>
            <div class="chat-info" onclick="openChatSettings()">
                <img src="" id="header-img" class="chat-img" alt="Chat">
                <div class="chat-meta">
                    <div class="chat-name" id="header-title">Loading...</div>
                    <div class="chat-status" id="member-count">...</div>
                </div>
            </div>
            <div class="header-actions"><i class="fas fa-pen" onclick="openChatSettings()"></i></div>
        </header>

        <div id="main-content">
            <!-- Messages -->
            <div id="view-messages" class="section-view active">
                <div id="chat-area">
                    <div style="text-align:center; padding: 40px; opacity: 0.5;">Select a group to start.</div>
                </div>
                <div class="typing-indicator" id="typing-indicator"></div>
                <div id="input-area">
                    <label class="attach-btn"><i class="fas fa-image"></i><input type="file" id="file-input" style="display: none;" accept="image/*"></label>
                    <div class="input-wrapper">
                        <div id="reply-indicator">
                            <span id="reply-text">Replying...</span>
                            <i class="fas fa-times" onclick="cancelReply()"></i>
                        </div>
                        <textarea id="msg-input" rows="1" placeholder="Type a message..."></textarea>
                    </div>
                    <button class="send-btn" id="send-btn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <!-- Groups -->
            <div id="view-groups" class="section-view" style="padding: 20px;">
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <button class="btn" style="flex:1; margin:0;" onclick="openModal('create-group-modal')">Create Group</button>
                    <button class="btn" style="flex:1; margin:0; background: var(--surface-2);" onclick="openModal('join-group-modal')">Join Group</button>
                </div>
                <h2 style="margin-top:0;">My Groups</h2>
                <div id="groups-list"></div>
            </div>

            <!-- Media -->
            <div id="view-media" class="section-view" style="padding: 20px;"><h2 style="margin-top:0;">Media Gallery</h2><div class="gallery-grid" id="media-gallery"></div></div>
            
            <!-- Members -->
            <div id="view-members" class="section-view" style="padding: 20px;"><h2 style="margin-top:0;">Members <span id="members-total" style="font-size:0.6em; color:var(--text-muted);">(0)</span></h2><div id="members-list"></div></div>
            
            <!-- Profile -->
            <div id="view-profile" class="section-view" style="padding: 20px;">
                <div class="profile-container">
                    <img id="profile-pic-preview" class="profile-pic-lg" src=""><br>
                    <button class="btn" style="width:auto; padding: 8px 20px;" onclick="document.getElementById('profile-upload').click()">Change Photo</button>
                    <input type="file" id="profile-upload" style="display: none;" accept="image/*">
                    <div style="margin-top: 30px; text-align: left;">
                        <label>Display Name</label>
                        <input type="text" id="profile-name" class="auth-input">
                        <button class="btn" onclick="updateProfile()">Save Changes</button>
                    </div>
                    <div style="margin-top: 50px; border-top: 1px solid var(--surface-2); padding-top: 25px;">
                        <button class="btn" onclick="logout()" style="background: var(--surface-2);">Log Out</button>
                    </div>
                </div>
            </div>
        </div>

        <nav>
            <div class="nav-item active" onclick="switchTab('messages')"><i class="fas fa-comment-alt"></i> Chat</div>
            <div class="nav-item" onclick="switchTab('groups')"><i class="fas fa-layer-group"></i> Groups</div>
            <div class="nav-item" onclick="switchTab('media')"><i class="fas fa-images"></i> Media</div>
            <div class="nav-item" onclick="switchTab('members')"><i class="fas fa-users"></i> Members</div>
            <div class="nav-item" onclick="switchTab('profile')"><i class="fas fa-user"></i> Profile</div>
        </nav>
    </div>

    <!-- Modals -->
    <div id="chat-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('chat-modal')">&times;</span>
            <h3 style="text-align: center;">Group Settings</h3>
            <div style="text-align: center; margin-bottom: 10px;">
                <img id="chat-edit-img" src="" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover;">
                <br><button class="btn btn-text" id="change-icon-btn" onclick="document.getElementById('chat-img-upload').click()">Change Icon</button>
                <input type="file" id="chat-img-upload" hidden accept="image/*">
            </div>
            <div style="background: var(--surface-2); padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center;">
                <small style="color: var(--text-muted);">Group Code (Share to invite)</small>
                <div id="group-share-code" style="font-size: 1.2rem; font-weight: bold; letter-spacing: 2px; user-select: text;"></div>
            </div>
            <label>Group Name</label>
            <input type="text" id="chat-edit-name" class="auth-input">
            <label>Background</label>
            <input type="file" id="chat-bg-upload" class="auth-input" accept="image/*">
            <button class="btn" id="save-chat-btn" onclick="saveGroupSettings()">Save Changes</button>
            <button class="btn" id="delete-group-btn" onclick="deleteGroup()" style="background: var(--danger); margin-top: 10px; display: none;">Delete Group</button>
        </div>
    </div>

    <div id="create-group-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('create-group-modal')">&times;</span>
            <h3>Create Group</h3>
            <input type="text" id="new-group-name" class="auth-input" placeholder="Group Name">
            <button class="btn" onclick="createGroup()">Create</button>
        </div>
    </div>

    <div id="join-group-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('join-group-modal')">&times;</span>
            <h3>Join Group</h3>
            <input type="text" id="join-group-code" class="auth-input" placeholder="Enter Group Code">
            <button class="btn" onclick="joinGroup()">Join</button>
        </div>
    </div>

    <div id="edit-msg-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('edit-msg-modal')">&times;</span>
            <h3>Edit Message</h3>
            <input type="text" id="edit-msg-input" class="auth-input">
            <button class="btn" onclick="confirmEditMessage()">Update</button>
        </div>
    </div>

    <div id="media-modal" class="modal" onclick="closeModal('media-modal')">
        <div class="modal-content" style="background: transparent; box-shadow: none; border: none; text-align: center;">
            <div id="media-modal-content"></div>
        </div>
    </div>

    <div class="by-gabo">By GaboGabo</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, setDoc, getDocs, where, updateDoc, deleteDoc, serverTimestamp, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

        // Original ChatCom Config
        const firebaseConfig = {
            apiKey: "AIzaSyCTUuJTNqrSZKS66B9kOzXVR2SftkRyeVw",
            authDomain: "chatcom-2528d.firebaseapp.com",
            projectId: "chatcom-2528d",
            storageBucket: "chatcom-2528d.firebasestorage.app",
            messagingSenderId: "297806856410",
            appId: "1:297806856410:web:f44eb27004f0735d2da5e3",
            measurementId: "G-W6DC5RM8G5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = null;
        let isRegistering = false;
        let currentGroupId = 'global'; 
        let groupMetaUnsub = null; // Store unsub function
        let replyTo = null;
        let editingMsgId = null;
        let currentGroupRole = 'member'; // 'owner', 'manager', 'member'
        const DEFAULT_PIC = "https://ui-avatars.com/api/?background=random&color=fff&name=";

        // Image Utils
        function compressAndConvertImage(file) {
            return new Promise((resolve, reject) => {
                if (!file.type.startsWith('image/')) { reject('Images only.'); return; }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX = 500; let w=img.width, h=img.height;
                        if(w>MAX){ h*=MAX/w; w=MAX; }
                        canvas.width=w; canvas.height=h;
                        const ctx=canvas.getContext('2d');
                        ctx.drawImage(img,0,0,w,h);
                        resolve(canvas.toDataURL('image/jpeg', 0.5));
                    };
                };
            });
        }

        async function hashPassword(str) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
        }

        // Auth
        async function checkAuth() {
            const saved = localStorage.getItem('chatcom_user');
            if(saved) { currentUser = JSON.parse(saved); initApp(); }
            else { document.getElementById('auth-screen').style.display='flex'; }
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('auth-user').value.trim().toLowerCase();
            const pass = document.getElementById('auth-pass').value;
            const msgEl = document.getElementById('auth-msg');
            
            try {
                const passHash = await hashPassword(pass);
                const q = query(collection(db, "users"), where("username", "==", user));
                const snap = await getDocs(q);

                if(isRegistering) {
                    if(!snap.empty) { msgEl.textContent="Taken."; return; }
                    const newUser = { 
                        username: user, password: passHash, displayName: user, 
                        photoURL: DEFAULT_PIC+user, joinedGroups: ['global'],
                        joinedAt: serverTimestamp(), status: 'online' 
                    };
                    const ref = await addDoc(collection(db, "users"), newUser);
                    currentUser = { ...newUser, id: ref.id };
                } else {
                    if(snap.empty) { msgEl.textContent="Not found."; return; }
                    const d = snap.docs[0].data();
                    if(d.password!==passHash) { msgEl.textContent="Wrong password."; return; }
                    currentUser = { ...d, id: snap.docs[0].id };
                    if(!currentUser.joinedGroups) { 
                        await updateDoc(doc(db, "users", currentUser.id), { joinedGroups: ['global'] });
                        currentUser.joinedGroups = ['global'];
                    }
                }
                localStorage.setItem('chatcom_user', JSON.stringify(currentUser));
                initApp();
            } catch(err) { console.error(err); msgEl.textContent="Error."; }
        });

        document.getElementById('toggle-auth').onclick = () => {
            isRegistering=!isRegistering;
            document.getElementById('login-btn').textContent = isRegistering ? "Register" : "Log In";
            document.getElementById('toggle-auth').textContent = isRegistering ? "Log In" : "Create Account";
        };

        window.logout = () => { localStorage.removeItem('chatcom_user'); location.reload(); };

        function initApp() {
            document.getElementById('auth-screen').style.display='none';
            document.getElementById('app').classList.remove('hidden');
            
            switchGroup('global');
            listenToGroups();
            
            document.getElementById('profile-name').value = currentUser.displayName;
            document.getElementById('profile-pic-preview').src = currentUser.photoURL;
        }

        // --- GROUP LOGIC ---
        function listenToGroups() {
            onSnapshot(doc(db, "users", currentUser.id), async (userSnap) => {
                if(!userSnap.exists()) return;
                const userData = userSnap.data();
                const groupIds = userData.joinedGroups || ['global'];
                
                const listEl = document.getElementById('groups-list');
                listEl.innerHTML = '';

                renderGroupItem({ id: 'global', name: 'Global Chat', photo: DEFAULT_PIC+'Global' });

                for(const gid of groupIds) {
                    if(gid === 'global') continue;
                    const gSnap = await getDocs(query(collection(db, "groups"), where("__name__", "==", gid)));
                    if(!gSnap.empty) {
                        const gData = gSnap.docs[0].data();
                        renderGroupItem({ id: gSnap.docs[0].id, ...gData });
                    }
                }
            });
        }

        function renderGroupItem(g) {
            const div = document.createElement('div');
            div.className = `group-item ${g.id === currentGroupId ? 'active' : ''}`;
            div.onclick = () => switchGroup(g.id);
            div.innerHTML = `
                <img src="${g.photo || DEFAULT_PIC + g.name}" class="group-pic">
                <div class="group-info"><h4>${g.name}</h4></div>
            `;
            document.getElementById('groups-list').appendChild(div);
        }

        window.createGroup = async () => {
            const name = document.getElementById('new-group-name').value;
            if(!name) return;
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            const newGroup = {
                name: name,
                photo: DEFAULT_PIC + name,
                code: code,
                ownerId: currentUser.id,
                roles: { [currentUser.id]: 'owner' },
                members: [currentUser.id]
            };
            
            const ref = await addDoc(collection(db, "groups"), newGroup);
            await updateDoc(doc(db, "users", currentUser.id), {
                joinedGroups: arrayUnion(ref.id)
            });
            
            closeModal('create-group-modal');
            switchGroup(ref.id);
        }

        window.joinGroup = async () => {
            const code = document.getElementById('join-group-code').value.toUpperCase().trim();
            if(!code) return;
            
            const q = query(collection(db, "groups"), where("code", "==", code));
            const snap = await getDocs(q);
            
            if(snap.empty) { alert("Invalid Code"); return; }
            const groupId = snap.docs[0].id;
            
            await updateDoc(doc(db, "groups", groupId), {
                members: arrayUnion(currentUser.id),
                [`roles.${currentUser.id}`]: 'member'
            });
            
            await updateDoc(doc(db, "users", currentUser.id), {
                joinedGroups: arrayUnion(groupId)
            });
            
            closeModal('join-group-modal');
            switchGroup(groupId);
        }

        // --- SWITCH GROUP (REAL-TIME UPDATES) ---
        window.switchGroup = async (gid) => {
            currentGroupId = gid;
            document.querySelectorAll('.group-item').forEach(el => el.classList.remove('active'));
            
            // Clean up old listener
            if(groupMetaUnsub) groupMetaUnsub();

            if(gid === 'global') {
                groupMetaUnsub = onSnapshot(doc(db, "chat_settings", "global_settings"), (snap) => {
                    const data = snap.data() || {};
                    currentGroupRole = 'member';
                    setupChatView(data.name || 'Global Chat', data.photo || DEFAULT_PIC+'Global', data.background, null);
                });
            } else {
                groupMetaUnsub = onSnapshot(doc(db, "groups", gid), (snap) => {
                    if(snap.exists()) {
                        const data = snap.data();
                        currentGroupRole = data.roles ? (data.roles[currentUser.id] || 'member') : 'member';
                        setupChatView(data.name, data.photo, data.background, data.code);
                    } else {
                        // Group deleted while viewing
                        switchGroup('global');
                    }
                });
            }

            switchTab('messages');
            if(window.msgUnsub) window.msgUnsub();
            listenToMessages();
            if(window.memberUnsub) window.memberUnsub();
            listenToMembers();
        }

        function setupChatView(name, photo, bg, code) {
            document.getElementById('header-title').textContent = name;
            document.getElementById('header-img').src = photo || DEFAULT_PIC+name;
            document.getElementById('chat-area').style.backgroundImage = bg ? `url(${bg})` : 'none';
            
            document.getElementById('chat-edit-name').value = name;
            document.getElementById('chat-edit-img').src = photo || "";
            document.getElementById('group-share-code').textContent = code || "Global (Public)";
            
            const isOwner = (currentGroupId !== 'global' && currentGroupRole === 'owner');
            const canEdit = (currentGroupId !== 'global') && (currentGroupRole === 'owner' || currentGroupRole === 'manager');
            
            // Delete Group Button
            const delBtn = document.getElementById('delete-group-btn');
            delBtn.style.display = isOwner ? 'block' : 'none';

            // Settings Controls
            const btn = document.getElementById('save-chat-btn');
            btn.style.display = canEdit ? 'block' : 'none';
            if(!canEdit) {
                document.getElementById('chat-edit-name').disabled = true;
                document.getElementById('change-icon-btn').style.display = 'none';
                document.getElementById('chat-bg-upload').style.display = 'none';
            } else {
                document.getElementById('chat-edit-name').disabled = false;
                document.getElementById('change-icon-btn').style.display = 'inline-block';
                document.getElementById('chat-bg-upload').style.display = 'block';
            }
        }

        window.deleteGroup = async () => {
            if(!confirm("Are you sure? This cannot be undone.")) return;
            // 1. Remove from user's joined list locally
            await updateDoc(doc(db, "users", currentUser.id), {
                joinedGroups: arrayRemove(currentGroupId)
            });
            // 2. Delete the actual group document
            await deleteDoc(doc(db, "groups", currentGroupId));
            
            // Switch first then close
            switchGroup('global');
            closeModal('chat-modal');
        }

        // --- MESSAGING ---
        function listenToMessages() {
            // JS sort to avoid index error
            const q = query(collection(db, "messages"), where("groupId", "==", currentGroupId));
            window.msgUnsub = onSnapshot(q, (snap) => {
                const area = document.getElementById('chat-area');
                area.innerHTML = '<div style="height:10px"></div>'; 
                
                let msgs = [];
                snap.forEach(d => msgs.push({ ...d.data(), id: d.id }));
                msgs.sort((a,b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));

                msgs.forEach(m => renderMessage(m.id, m));
                
                // Auto scroll if near bottom
                if(msgs.length > 0) area.scrollTop = area.scrollHeight;
                updateGallery(snap.docs);
            });
        }

        function renderMessage(id, msg) {
            const isMe = msg.senderId === currentUser.id;
            const canDelete = isMe || (currentGroupRole === 'owner' || currentGroupRole === 'manager');
            
            const div = document.createElement('div');
            div.className = `msg-row ${isMe ? 'me' : 'them'}`;
            div.id = `msg-${id}`;
            
            let content = '';
            if(msg.replyTo) {
                // Fixed Reply UI Box with OnClick event
                content += `
                    <div class="reply-context" onclick="scrollToMessage('${msg.replyTo.id}')">
                        <small><b>${msg.replyTo.sender}</b></small>
                        <span>${msg.replyTo.text.substring(0,25)}...</span>
                    </div>`;
            }
            if(msg.type==='image') content += `<img src="${msg.mediaData}" class="msg-img" onclick="viewMedia('${msg.mediaData}')">`;
            if(msg.text) content += `<span>${msg.text}</span>`;

            const actions = `
                <div class="msg-actions">
                    <i class="fas fa-reply action-btn" onclick="startReply('${id}', '${msg.senderName}', '${msg.text||'Image'}')"></i>
                    ${isMe ? `<i class="fas fa-pen action-btn" onclick="openEditMessage('${id}', '${msg.text}')"></i>` : ''}
                    ${canDelete ? `<i class="fas fa-trash action-btn delete" onclick="deleteMessage('${id}')"></i>` : ''}
                </div>
            `;

            const pfp = !isMe ? `<img src="${msg.senderPic || DEFAULT_PIC+msg.senderName}" class="msg-pfp">` : '';
            const time = msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '';

            div.innerHTML = `
                ${pfp}
                <div class="msg ${isMe ? 'me' : 'them'}">
                    ${actions}
                    ${!isMe ? `<span class="msg-sender">${msg.senderName}</span>` : ''}
                    ${content}
                    <div class="msg-meta">${time} ${msg.edited ? '(edited)' : ''}</div>
                </div>
            `;
            document.getElementById('chat-area').appendChild(div);
        }

        window.scrollToMessage = function(id) {
            const el = document.getElementById(`msg-${id}`);
            if(el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                const bubble = el.querySelector('.msg');
                if(bubble) {
                    bubble.classList.add('highlight-anim');
                    setTimeout(() => bubble.classList.remove('highlight-anim'), 1000);
                }
            } else {
                alert("Message not found or too old.");
            }
        }

        window.sendMessage = async () => {
            const txt = document.getElementById('msg-input').value.trim();
            if(!txt) return;
            document.getElementById('msg-input').value='';
            
            await addDoc(collection(db, "messages"), {
                text: txt, groupId: currentGroupId,
                senderId: currentUser.id, senderName: currentUser.displayName, senderPic: currentUser.photoURL,
                timestamp: serverTimestamp(), type: 'text', replyTo: replyTo
            });
            cancelReply();
        };
        document.getElementById('send-btn').onclick = sendMessage;

        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const btn = document.querySelector('.attach-btn');
            const icon = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            
            try {
                const base64 = await compressAndConvertImage(file);
                await addDoc(collection(db, "messages"), {
                    text: '', groupId: currentGroupId, mediaData: base64,
                    senderId: currentUser.id, senderName: currentUser.displayName, senderPic: currentUser.photoURL,
                    timestamp: serverTimestamp(), type: 'image'
                });
            } catch(err) { alert(err); }
            btn.innerHTML = icon;
            e.target.value = '';
        });

        window.openEditMessage = (id, text) => {
            editingMsgId = id;
            document.getElementById('edit-msg-input').value = text;
            openModal('edit-msg-modal');
        }
        window.confirmEditMessage = async () => {
            const txt = document.getElementById('edit-msg-input').value;
            await updateDoc(doc(db, "messages", editingMsgId), { text: txt, edited: true });
            closeModal('edit-msg-modal');
        }
        window.deleteMessage = async (id) => {
            if(confirm("Delete message?")) await deleteDoc(doc(db, "messages", id));
        }

        // --- MEMBERS ---
        function listenToMembers() {
            let q;
            if(currentGroupId === 'global') {
                q = query(collection(db, "users")); 
            } else {
                q = query(collection(db, "users"), where("joinedGroups", "array-contains", currentGroupId));
            }

            window.memberUnsub = onSnapshot(q, async (snap) => {
                const list = document.getElementById('members-list');
                list.innerHTML = '';
                document.getElementById('members-total').textContent = `(${snap.size})`;
                document.getElementById('member-count').textContent = `${snap.size} members`;

                let roles = {};
                if(currentGroupId !== 'global') {
                    const gDoc = await getDocs(query(collection(db, "groups"), where("__name__", "==", currentGroupId)));
                    if(!gDoc.empty) roles = gDoc.docs[0].data().roles || {};
                }

                snap.forEach(d => {
                    const u = d.data();
                    const role = (currentGroupId === 'global') ? 'member' : (roles[d.id] || 'member');
                    
                    let roleIcon = '';
                    if(role === 'owner') roleIcon = '<i class="fas fa-crown role-badge role-owner"></i>';
                    if(role === 'manager') roleIcon = '<i class="fas fa-shield-alt role-badge role-manager"></i>';

                    let actions = '';
                    const amIOwner = currentGroupRole === 'owner';
                    if(amIOwner && d.id !== currentUser.id && currentGroupId !== 'global') {
                        if(role === 'member') actions = `<i class="fas fa-arrow-up member-action" onclick="changeRole('${d.id}', 'manager')" title="Promote"></i>`;
                        if(role === 'manager') actions = `<i class="fas fa-arrow-down member-action" onclick="changeRole('${d.id}', 'member')" title="Demote"></i>`;
                    }

                    const div = document.createElement('div');
                    div.className = 'member-item';
                    div.innerHTML = `
                        <img src="${u.photoURL}" class="member-pic">
                        <div class="member-info">
                            <h4>${u.displayName} ${roleIcon}</h4>
                            <span>${u.status||'Offline'}</span>
                        </div>
                        ${actions}
                    `;
                    list.appendChild(div);
                });
            });
        }

        window.changeRole = async (uid, newRole) => {
            const groupRef = doc(db, "groups", currentGroupId);
            await updateDoc(groupRef, { [`roles.${uid}`]: newRole });
        }

        window.saveGroupSettings = async () => {
            if(currentGroupRole === 'member' && currentGroupId !== 'global') return;
            const btn = document.getElementById('save-chat-btn');
            const originalText = btn.textContent;
            btn.textContent = "Saving...";
            
            const name = document.getElementById('chat-edit-name').value;
            const imgFile = document.getElementById('chat-img-upload').files[0];
            const bgFile = document.getElementById('chat-bg-upload').files[0];
            
            let data = { name: name };
            if(imgFile) data.photo = await compressAndConvertImage(imgFile);
            if(bgFile) data.background = await compressAndConvertImage(bgFile);

            if(currentGroupId === 'global') {
                await setDoc(doc(db, "chat_settings", "global_settings"), data, {merge:true});
            } else {
                await updateDoc(doc(db, "groups", currentGroupId), data);
            }
            btn.textContent = "Saved!";
            setTimeout(() => {
                closeModal('chat-modal');
                btn.textContent = originalText;
            }, 500);
        }

        window.openChatSettings = () => openModal('chat-modal');

        window.startReply = (id, sender, text) => { replyTo={id,sender,text}; document.getElementById('reply-indicator').style.display='flex'; document.getElementById('reply-text').innerHTML=`Replying to <b>${sender}</b>`; };
        window.cancelReply = () => { replyTo=null; document.getElementById('reply-indicator').style.display='none'; };
        
        window.updateProfile = async () => {
            const name = document.getElementById('profile-name').value;
            const file = document.getElementById('profile-upload').files[0];
            let data = { displayName: name };
            if(file) data.photoURL = await compressAndConvertImage(file);
            await updateDoc(doc(db, "users", currentUser.id), data);
            currentUser = { ...currentUser, ...data };
            localStorage.setItem('chatcom_user', JSON.stringify(currentUser));
            document.getElementById('profile-pic-preview').src = currentUser.photoURL;
            alert("Saved");
        }

        function updateGallery(docs) {
            const grid = document.getElementById('media-gallery'); grid.innerHTML='';
            docs.forEach(d => {
                const m = d.data();
                if(m.type==='image' && m.mediaData) {
                    grid.innerHTML += `<div class="gallery-item" onclick="viewMedia('${m.mediaData}')"><img src="${m.mediaData}"></div>`;
                }
            });
        }

        window.viewMedia = (url) => { document.getElementById('media-modal-content').innerHTML=`<img src="${url}" style="max-width:100%;max-height:80vh;border-radius:12px;">`; openModal('media-modal'); }
        window.switchTab = (id) => { 
            document.querySelectorAll('.section-view').forEach(e=>e.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
            document.getElementById(`view-${id}`).classList.add('active');
            const idx = ['messages','groups','media','members','profile'].indexOf(id);
            if(idx>-1) document.querySelectorAll('.nav-item')[idx].classList.add('active');
        };
        window.openModal = (id) => { document.getElementById(id).style.display='flex'; setTimeout(()=>document.getElementById(id).classList.add('open'),10); };
        window.closeModal = (id) => { document.getElementById(id).classList.remove('open'); setTimeout(()=>document.getElementById(id).style.display='none',200); };

        // Manifest & SW
        const manifest = { "name": "ChatCom", "short_name": "ChatCom", "start_url": ".", "display": "standalone", "background_color": "#121212", "theme_color": "#121212", "icons": [{ "src": "https://ui-avatars.com/api/?name=CC&background=3b82f6&color=fff&size=192", "sizes": "192x192", "type": "image/png" }] };
        document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/json'})));
        if ('serviceWorker' in navigator) navigator.serviceWorker.register(URL.createObjectURL(new Blob([`self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));self.addEventListener('fetch', e => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });`], {type: 'application/javascript'})));

        checkAuth();
    </script>
</body>
</html>
