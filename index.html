<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SkyCast Weather</title>
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="./icon.png">
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Custom Scrollbar for hourly forecast */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body { transition: background-color 0.3s, color 0.3s; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-400 to-blue-700 text-white min-h-screen font-sans dark:from-gray-900 dark:to-gray-800 transition-colors duration-500">

    <div class="max-w-md mx-auto p-4 flex flex-col gap-6 relative">
        
        <!-- Header / Search -->
        <header class="flex gap-2 items-center z-10">
            <button onclick="getLocation()" class="p-3 bg-white/20 hover:bg-white/30 rounded-xl transition">
                <i class="fa-solid fa-location-crosshairs"></i>
            </button>
            <div class="relative flex-1">
                <input type="text" id="searchInput" placeholder="Search city..." 
                       class="w-full py-3 px-4 bg-white/20 placeholder-white/70 rounded-xl outline-none focus:ring-2 ring-white/50 dark:bg-gray-800/50">
                <button onclick="handleSearch()" class="absolute right-3 top-3.5 text-white/80 hover:text-white">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <button onclick="toggleTheme()" class="p-3 bg-white/20 hover:bg-white/30 rounded-xl transition">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
        </header>

        <!-- Loading State -->
        <div id="loader" class="hidden absolute inset-0 z-50 flex items-center justify-center bg-blue-500/50 dark:bg-gray-900/50 backdrop-blur-sm rounded-xl h-[80vh]">
            <i class="fa-solid fa-spinner fa-spin text-4xl"></i>
        </div>

        <!-- Main Weather Info -->
        <main id="weatherContent" class="flex flex-col gap-6 opacity-0 transition-opacity duration-500">
            <div class="text-center mt-4">
                <h1 id="cityName" class="text-4xl font-bold tracking-wider mb-2">Loading...</h1>
                <p id="dateString" class="text-white/80 text-sm mb-6"></p>
                <i id="mainIcon" class="fa-solid fa-cloud-sun text-7xl drop-shadow-lg mb-4"></i>
                <h2 id="temperature" class="text-6xl font-black mb-2">--°</h2>
                <p id="weatherDesc" class="text-xl font-medium capitalize">--</p>
                <div class="flex justify-center gap-4 mt-3 text-sm text-white/80">
                    <span>H: <span id="tempHigh">--</span>°</span>
                    <span>L: <span id="tempLow">--</span>°</span>
                </div>
            </div>

            <!-- Details Grid -->
            <div class="grid grid-cols-2 gap-4">
                <div class="glass-panel p-4 rounded-2xl flex items-center gap-3">
                    <i class="fa-solid fa-wind text-2xl text-white/70"></i>
                    <div>
                        <p class="text-xs text-white/60">Wind</p>
                        <p id="windSpeed" class="font-bold">-- km/h</p>
                    </div>
                </div>
                <div class="glass-panel p-4 rounded-2xl flex items-center gap-3">
                    <i class="fa-solid fa-droplet text-2xl text-white/70"></i>
                    <div>
                        <p class="text-xs text-white/60">Humidity</p>
                        <p id="humidity" class="font-bold">-- %</p>
                    </div>
                </div>
                <div class="glass-panel p-4 rounded-2xl flex items-center gap-3">
                    <i class="fa-solid fa-temperature-half text-2xl text-white/70"></i>
                    <div>
                        <p class="text-xs text-white/60">Feels Like</p>
                        <p id="feelsLike" class="font-bold">--°</p>
                    </div>
                </div>
                <div class="glass-panel p-4 rounded-2xl flex items-center gap-3">
                    <i class="fa-solid fa-sun text-2xl text-white/70"></i>
                    <div>
                        <p class="text-xs text-white/60">UV Index</p>
                        <p id="uvIndex" class="font-bold">--</p>
                    </div>
                </div>
            </div>

            <!-- Hourly Forecast -->
            <div class="glass-panel p-4 rounded-2xl">
                <h3 class="text-sm font-semibold mb-4 text-white/80"><i class="fa-regular fa-clock mr-2"></i>Hourly Forecast</h3>
                <div id="hourlyContainer" class="flex gap-4 overflow-x-auto hide-scrollbar pb-2">
                    <!-- Hourly items injected via JS -->
                </div>
            </div>

            <!-- 7-Day Forecast -->
            <div class="glass-panel p-4 rounded-2xl mb-8">
                <h3 class="text-sm font-semibold mb-4 text-white/80"><i class="fa-regular fa-calendar mr-2"></i>7-Day Forecast</h3>
                <div id="dailyContainer" class="flex flex-col gap-3">
                    <!-- Daily items injected via JS -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- 1. Service Worker Registration ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered!', reg))
                    .catch(err => console.log('SW registration failed', err));
            });
        }

        // --- 2. State & Constants ---
        let isDarkMode = localStorage.getItem('darkMode') === 'true';
        if(isDarkMode) document.documentElement.classList.add('dark');
        updateThemeIcon();

        // WMO Weather Code Mapping to Icons and Text
        const weatherCodes = {
            0: { desc: 'Clear sky', icon: 'fa-sun' },
            1: { desc: 'Mainly clear', icon: 'fa-sun' },
            2: { desc: 'Partly cloudy', icon: 'fa-cloud-sun' },
            3: { desc: 'Overcast', icon: 'fa-cloud' },
            45: { desc: 'Fog', icon: 'fa-smog' },
            48: { desc: 'Depositing rime fog', icon: 'fa-smog' },
            51: { desc: 'Light drizzle', icon: 'fa-cloud-rain' },
            53: { desc: 'Moderate drizzle', icon: 'fa-cloud-rain' },
            55: { desc: 'Dense drizzle', icon: 'fa-cloud-rain' },
            61: { desc: 'Slight rain', icon: 'fa-cloud-showers-heavy' },
            63: { desc: 'Moderate rain', icon: 'fa-cloud-showers-heavy' },
            65: { desc: 'Heavy rain', icon: 'fa-cloud-showers-heavy' },
            71: { desc: 'Slight snow', icon: 'fa-snowflake' },
            73: { desc: 'Moderate snow', icon: 'fa-snowflake' },
            75: { desc: 'Heavy snow', icon: 'fa-snowflake' },
            95: { desc: 'Thunderstorm', icon: 'fa-bolt' },
            96: { desc: 'Thunderstorm with hail', icon: 'fa-bolt' },
            99: { desc: 'Heavy thunderstorm', icon: 'fa-bolt' }
        };

        function getWeatherInfo(code) {
            return weatherCodes[code] || { desc: 'Unknown', icon: 'fa-cloud' };
        }

        // --- 3. App Logic ---
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleSearch();
        });

        // Initialize App
        getLocation();

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            localStorage.setItem('darkMode', isDarkMode);
            document.documentElement.classList.toggle('dark');
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            icon.className = isDarkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        function showLoader(show) {
            document.getElementById('loader').style.display = show ? 'flex' : 'none';
            document.getElementById('weatherContent').style.opacity = show ? '0' : '1';
        }

        function getLocation() {
            if (navigator.geolocation) {
                showLoader(true);
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        fetchCityNameAndWeather(lat, lon);
                    },
                    (error) => {
                        console.warn("Geolocation blocked. Defaulting to New York.");
                        fetchWeather(40.7128, -74.0060, "New York"); // Default city
                    }
                );
            }
        }

        async function fetchCityNameAndWeather(lat, lon) {
            try {
                // Reverse geocoding using OpenStreetMap (Nominatim)
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);
                const data = await res.json();
                const city = data.address.city || data.address.town || data.address.village || "Current Location";
                fetchWeather(lat, lon, city);
            } catch (error) {
                fetchWeather(lat, lon, "Current Location");
            }
        }

        async function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            
            showLoader(true);
            try {
                // Geocoding API from Open-Meteo
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`);
                const geoData = await geoRes.json();
                
                if (geoData.results && geoData.results.length > 0) {
                    const loc = geoData.results[0];
                    fetchWeather(loc.latitude, loc.longitude, loc.name);
                } else {
                    alert('City not found!');
                    showLoader(false);
                }
            } catch (err) {
                alert('Error searching for city.');
                showLoader(false);
            }
        }

        async function fetchWeather(lat, lon, cityName) {
            showLoader(true);
            try {
                // Open-Meteo comprehensive endpoint
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max&timezone=auto`;
                
                const res = await fetch(url);
                const data = await res.json();
                updateUI(data, cityName);
            } catch (error) {
                console.error("Error fetching weather:", error);
                alert("Failed to fetch weather data. You might be offline.");
            } finally {
                showLoader(false);
            }
        }

        function updateUI(data, cityName) {
            const current = data.current;
            const daily = data.daily;
            const hourly = data.hourly;
            
            const info = getWeatherInfo(current.weather_code);

            // Top Section
            document.getElementById('cityName').textContent = cityName;
            document.getElementById('dateString').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            document.getElementById('temperature').textContent = Math.round(current.temperature_2m) + '°';
            document.getElementById('weatherDesc').textContent = info.desc;
            document.getElementById('mainIcon').className = `fa-solid ${info.icon} text-7xl drop-shadow-lg mb-4`;
            
            document.getElementById('tempHigh').textContent = Math.round(daily.temperature_2m_max[0]);
            document.getElementById('tempLow').textContent = Math.round(daily.temperature_2m_min[0]);

            // Grid Details
            document.getElementById('windSpeed').textContent = current.wind_speed_10m + ' km/h';
            document.getElementById('humidity').textContent = current.relative_humidity_2m + ' %';
            document.getElementById('feelsLike').textContent = Math.round(current.apparent_temperature) + '°';
            document.getElementById('uvIndex').textContent = daily.uv_index_max[0] || '--';

            // Hourly Forecast (Next 24 hours)
            const hourlyContainer = document.getElementById('hourlyContainer');
            hourlyContainer.innerHTML = '';
            const currentHourIndex = hourly.time.findIndex(t => new Date(t) > new Date()) || 0;
            
            for(let i = currentHourIndex; i < currentHourIndex + 24; i += 2) { // Every 2 hours
                if(!hourly.time[i]) break;
                const time = new Date(hourly.time[i]).toLocaleTimeString([], { hour: 'numeric' });
                const temp = Math.round(hourly.temperature_2m[i]);
                const hInfo = getWeatherInfo(hourly.weather_code[i]);
                
                hourlyContainer.innerHTML += `
                    <div class="flex flex-col items-center min-w-[60px] gap-2">
                        <span class="text-xs text-white/80">${time}</span>
                        <i class="fa-solid ${hInfo.icon} text-lg"></i>
                        <span class="font-bold">${temp}°</span>
                    </div>
                `;
            }

            // 7-Day Forecast
            const dailyContainer = document.getElementById('dailyContainer');
            dailyContainer.innerHTML = '';
            
            for(let i = 1; i < 7; i++) {
                const date = new Date(daily.time[i]).toLocaleDateString('en-US', { weekday: 'short' });
                const max = Math.round(daily.temperature_2m_max[i]);
                const min = Math.round(daily.temperature_2m_min[i]);
                const dInfo = getWeatherInfo(daily.weather_code[i]);

                dailyContainer.innerHTML += `
                    <div class="flex justify-between items-center py-2 border-b border-white/10 last:border-0">
                        <span class="w-12 font-medium">${date}</span>
                        <div class="flex-1 flex justify-center"><i class="fa-solid ${dInfo.icon} text-white/80"></i></div>
                        <div class="w-24 text-right flex justify-end gap-3 text-sm">
                            <span class="font-bold">${max}°</span>
                            <span class="text-white/60">${min}°</span>
                        </div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
